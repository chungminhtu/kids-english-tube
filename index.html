<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube cho bé</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;padding:16px 20px 50px;background:#f6fbf6;color:#1f2a22;
 font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
h1{font-size:25px;margin:0 0 10px;color:#2e7d32}
.bar{position:sticky;top:0;background:#f6fbf6;padding:8px 0 10px;z-index:5;
 border-bottom:2px dashed #b7dfc0;margin-bottom:16px}
#q{width:100%;max-width:380px;padding:11px 14px;border:2px solid #a5d6a7;border-radius:14px;
 background:#fff;font-size:16px;font-family:inherit}
#q:focus{outline:none;border-color:#34a853}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid #b7dfc0;background:#fff;color:#1f2a22;border-radius:999px;
 padding:8px 15px;font-size:15px;cursor:pointer;font-family:inherit}
.chip:hover{background:#eaf7ec}
.chip.on{background:#2e7d32;border-color:#2e7d32;color:#fff;box-shadow:0 2px 8px rgba(46,125,50,.35)}
.chip b{font-weight:700;opacity:.65;font-size:12px}
section.cat h2{font-size:20px;margin:0 0 12px;padding:6px 12px;border-radius:12px;
 background:#e3f2e5;display:inline-block}
.ch{background:#fff;border:2px solid #e4efe6;border-radius:16px;padding:12px 14px;margin:0 0 12px}
a.cname{font-size:17px;font-weight:700;color:#1b6e2f;text-decoration:none}
a.cname:hover{text-decoration:underline}
.desc{color:#55635a;font-size:13px;margin:3px 0 9px}
.vids{display:flex;gap:12px;flex-wrap:wrap}
.v{width:224px}
.v img{width:224px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#e8efe9;display:block}
.v img:hover{outline:3px solid #34a853}
.v a{text-decoration:none}
.v .t{display:block;font-size:14px;margin:5px 0 0;color:#1f2a22}
.v a:hover .t{color:#1b6e2f;text-decoration:underline}
.v .en{display:block;font-size:12px;color:#7d8a81;margin-top:2px}
.v .d{font-size:12px;color:#9aa79f}
.skel{width:224px;height:126px;border-radius:12px;background:#eef4ef}
.err{color:#c04b4b;font-size:13px}
#none{color:#7d8a81}
</style>

<h1>📺 YouTube cho bé</h1>
<div class="bar">
  <input id="q" type="search" placeholder="Tìm kênh...">
  <div class="chips" id="chips"></div>
</div>
<p id="none" hidden>Không có kênh nào khớp.</p>
<div id="body"></div>

<script src="channels.js"></script>
<script>
var PER_CHANNEL = 10;
var CACHE_MS = 60 * 60 * 1000;      // nho video 1 gio, F5 khong goi proxy lai
var PROXY_TIMEOUT = 12000;
var PROXIES = [
  {url: function(u){ return 'https://corsproxy.io/?url=' + encodeURIComponent(u) }, kind: 'xml'},
  {url: function(u){ return 'https://api.cors.lol/?url=' + encodeURIComponent(u) }, kind: 'xml'},
  {url: function(u){ return 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(u) },
   kind: 'rss2json'},
  {url: function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) }, kind: 'xml'},
  {url: function(u){ return 'https://api.allorigins.win/get?url=' + encodeURIComponent(u) }, kind: 'wrapped'},
  {url: function(u){ return 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) }, kind: 'xml'}
];
var localFeed = true;

function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null') }catch(e){ return null } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
function cacheGet(cid, stale){
  var c = lsGet('f:' + cid);
  return (c && c.v && (stale || Date.now() - c.t < CACHE_MS)) ? c.v : null;
}

function parseFeed(xml){
  var doc = new DOMParser().parseFromString(xml, 'application/xml');
  return [].slice.call(doc.getElementsByTagName('entry')).slice(0, PER_CHANNEL).map(function(e){
    function txt(t){ var n = e.getElementsByTagName(t)[0]; return n ? n.textContent : '' }
    var id = txt('yt:videoId') || txt('videoId');
    return {id: id, title: txt('title'), published: (txt('published') || '').slice(0, 10),
            thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'};
  }).filter(function(v){ return v.id });
}
function parseRss2Json(text){
  var j = JSON.parse(text);
  return (j.items || []).slice(0, PER_CHANNEL).map(function(it){
    var id = (it.guid || '').split(':').pop() || (it.link || '').split('v=').pop();
    return {id: id, title: it.title || '', published: (it.pubDate || '').slice(0, 10),
            thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'};
  }).filter(function(v){ return v.id.length === 11 });
}
function grab(url, kind){
  var ctl = new AbortController(), t = setTimeout(function(){ ctl.abort() }, PROXY_TIMEOUT);
  return fetch(url, {signal: ctl.signal}).then(function(r){
    if(!r.ok) throw 0;
    return r.text();
  }).then(function(x){
    var v = kind === 'rss2json' ? parseRss2Json(x)
          : kind === 'wrapped'  ? parseFeed(JSON.parse(x).contents || '')
          : parseFeed(x);
    if(!v.length) throw 0;
    return v;
  }).finally(function(){ clearTimeout(t) });
}
function fetchFeed(cid){
  var fresh = cacheGet(cid, false);
  if(fresh) return Promise.resolve(fresh);
  var rss = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + cid, chain = Promise.reject();
  if(localFeed){
    chain = fetch('/feed?cid=' + cid).then(function(r){
      if(!r.ok) throw 0;
      return r.json();
    }).then(function(j){
      if(!j.videos || !j.videos.length) throw 0;
      return j.videos.slice(0, PER_CHANNEL);
    }).catch(function(){ localFeed = false; throw 0 });
  }
  PROXIES.forEach(function(p){ chain = chain.catch(function(){ return grab(p.url(rss), p.kind) }) });
  return chain.then(function(v){ lsSet('f:' + cid, {t: Date.now(), v: v}); return v })
              .catch(function(e){ var s = cacheGet(cid, true); if(s) return s; throw e });
}

/* dich tieu de sang tieng Viet, ca cum 1 lan goi, nho vinh vien trong may */
function translate(texts){
  var out = texts.map(function(t){ return lsGet('t:' + t) });
  var todo = texts.filter(function(t, i){ return !out[i] });
  if(!todo.length) return Promise.resolve(out);
  var blob = encodeURIComponent(todo.join('\n'));
  var gtx = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + blob;
  return fetch(gtx).then(function(r){
    if(!r.ok) throw 0;
    return r.json();
  }).then(function(j){
    return j[0].map(function(s){ return s[0] }).join('').split('\n');
  }).catch(function(){
    return fetch('https://api.mymemory.translated.net/get?langpair=en|vi&q=' + blob)
      .then(function(r){ return r.json() })
      .then(function(j){ return (j.responseData.translatedText || '').split('\n') });
  }).then(function(vi){
    todo.forEach(function(t, i){ if(vi[i]) lsSet('t:' + t, vi[i]) });
    return texts.map(function(t, i){ return out[i] || lsGet('t:' + t) || t });
  }).catch(function(){ return texts });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;') }
function card(v, vi){
  return '<div class="v"><a href="https://www.youtube.com/watch?v=' + v.id +
    '" target="_blank" rel="noreferrer"><img loading="lazy" src="' + v.thumb + '" alt="">' +
    '<span class="t">' + esc(vi || v.title) + '</span>' +
    (vi && vi !== v.title ? '<span class="en">' + esc(v.title) + '</span>' : '') +
    '</a><span class="d">' + esc(v.published) + '</span></div>';
}
function chRow(c){
  return '<div class="ch" data-cid="' + c[1] + '">' +
    '<a class="cname" href="https://www.youtube.com/channel/' + c[1] +
    '" target="_blank" rel="noreferrer">' + esc(c[0]) + '</a>' +
    '<p class="desc">' + esc(c[2] || '') + '</p>' +
    '<div class="vids">' + new Array(PER_CHANNEL + 1).join('<div class="skel"></div>') + '</div></div>';
}

var CATS = Object.keys(window.CHANNELS), chipsBox = document.getElementById('chips'),
    body = document.getElementById('body'), none = document.getElementById('none'),
    q = document.getElementById('q');
CATS.forEach(function(cat, i){
  chipsBox.insertAdjacentHTML('beforeend', '<button class="chip" data-cat="' + i + '">' +
    esc(cat) + ' <b>' + window.CHANNELS[cat].length + '</b></button>');
});

var saved = lsGet('ui') || {};
var animals = CATS.findIndex(function(c){ return c.indexOf('Động vật') >= 0 });
var cur = (saved.cat != null && saved.cat < CATS.length) ? saved.cat : (animals < 0 ? 0 : animals);
q.value = saved.q || '';

var queue = [], running = 0;
function pump(){
  while(running < 3 && queue.length){
    running++;
    (function(d){
      var box = d.querySelector('.vids');
      fetchFeed(d.dataset.cid).then(function(vs){
        box.innerHTML = vs.map(function(v){ return card(v, null) }).join('');
        return translate(vs.map(function(v){ return v.title })).then(function(vi){
          box.innerHTML = vs.map(function(v, i){ return card(v, vi[i]) }).join('');
        });
      }).catch(function(){
        box.innerHTML = '<span class="err">Không tải được video. Bấm lại chủ đề để thử lần nữa.</span>';
      }).finally(function(){ running--; pump() });
    })(queue.shift());
  }
}

function render(){
  var s = q.value.trim().toLowerCase(), rows = [], shown = 0;
  if(s){
    CATS.forEach(function(cat){
      var hit = window.CHANNELS[cat].filter(function(c){
        return c[0].toLowerCase().indexOf(s) >= 0 || (c[2] || '').toLowerCase().indexOf(s) >= 0
               || cat.toLowerCase().indexOf(s) >= 0;
      });
      if(hit.length){
        rows.push('<section class="cat"><h2>' + esc(cat) + '</h2>' + hit.map(chRow).join('') + '</section>');
        shown += hit.length;
      }
    });
  }else{
    var cat = CATS[cur], chans = window.CHANNELS[cat];
    rows.push('<section class="cat"><h2>' + esc(cat) + '</h2>' + chans.map(chRow).join('') + '</section>');
    shown = chans.length;
  }
  body.innerHTML = rows.join('');
  none.hidden = shown > 0;
  queue = [].slice.call(body.querySelectorAll('.ch'));
  running = 0;
  pump();
  lsSet('ui', {cat: cur, q: q.value});
}

chipsBox.addEventListener('click', function(e){
  var c = e.target.closest('.chip');
  if(!c) return;
  cur = +c.dataset.cat;
  q.value = '';
  [].forEach.call(chipsBox.children, function(x){ x.classList.toggle('on', x === c) });
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
});
q.addEventListener('input', function(){
  [].forEach.call(chipsBox.children, function(x){ x.classList.toggle('on', !q.value && +x.dataset.cat === cur) });
  render();
});
q.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ q.value = ''; q.dispatchEvent(new Event('input')) } });

chipsBox.children[cur].classList.toggle('on', !q.value);
render();
</script>
</html>
